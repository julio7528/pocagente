    source_class: "official_support"
    authority_level: "secondary"
    scope: ["sales", "cancellation", "cancellation_status"]
    audience: ["pessoa_fisica", "mei", "pessoa_juridica"]
    approved: true
    active: true
    ingestion: {enabled: true, mode: "manual", content_type: "html", allow_discovered_links: false}

  - source_id: "getnet-app-reversal"
    title: "Como estornar uma venda pelo aplicativo Getnet Brasil"
    url: "https://site.getnet.com.br/get-ajuda-estorno/como-estornar-uma-venda-pelo-aplicativo-getnet-brasil/"
    domain: "site.getnet.com.br"
    source_type: "public_getnet"
    source_class: "official_support"
    authority_level: "secondary"
    scope: ["sales", "cancellation", "reversal", "partial_reversal"]
    audience: ["pessoa_fisica", "mei", "pessoa_juridica"]
    approved: true
    active: true
    ingestion: {enabled: true, mode: "manual", content_type: "html", allow_discovered_links: false}

  - source_id: "getnet-cancellation-letter"
