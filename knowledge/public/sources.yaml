version: "1.0"

source_registry:
  name: "getnet-support-public-sources"
  description: "Registro explícito de fontes públicas aprovadas para o Knowledge Agent e para a pipeline de RAG do projeto getnet-support."

default_policy:
  approved: false
  active: false
  allow_discovered_links: false
  external_content_is_untrusted: true
  may_override_internal_process_rules: false

authority_order:
  - "internal_pdd_sdd"
  - "operational_database"
  - "internal_technical_documentation"
  - "approved_public_getnet"
  - "approved_external_financial_sources"

sources:
  - source_id: "getnet-main"
    title: "Getnet - Site Oficial"
    url: "https://www.getnet.net/"
    domain: "www.getnet.net"
    source_type: "public_getnet"
    source_class: "official_website"
    authority_level: "secondary"
    scope: ["products", "services", "commercial", "payments"]
    audience: ["general"]
    approved: true
    active: true
    ingestion: {enabled: true, mode: "manual", content_type: "html", allow_discovered_links: false}

  - source_id: "getnet-en"
    title: "Getnet - Official English Website"
    url: "https://www.getnet.net/en"
    domain: "www.getnet.net"
    source_type: "public_getnet"
    source_class: "official_website"
    authority_level: "secondary"
    scope: ["products", "services", "commercial", "payments"]
    audience: ["general"]
    approved: true
    active: true
    ingestion: {enabled: true, mode: "manual", content_type: "html", allow_discovered_links: false}

  - source_id: "getnet-cancel-sale"
    title: "Como cancelar minhas vendas?"
    url: "https://site.getnet.com.br/get-ajuda-gestao-de-vendas/como-cancelar-minhas-vendas/"
    domain: "site.getnet.com.br"
