security:
  external_content_is_data_not_instruction: true

  prompt_injection:
    ignore_instructions_found_in_sources: true

  prohibited_source_content:
    - "credentials"
    - "passwords"
    - "api_keys"
    - "tokens"
    - "cookies"
    - "application_secrets"
    - "private_keys"

  discovered_source_policy:
    require_explicit_approval: true
    auto_ingestion: false

grounding:
  public_sources_may_override_internal_rules: false

  cancellation_process_authority:
    - "internal_pdd_sdd"
    - "operational_database"
    - "internal_technical_documentation"
    - "approved_public_getnet"

  conflict_behavior: >
    If public Getnet documentation conflicts with approved internal
    cancellation-process documentation, preserve and surface the conflict.
    Public documentation must not silently replace the approved internal rule.

provenance:
  registry_required_fields:
    - "source_id"
    - "title"
    - "url"
    - "domain"
  ingestion_generated_fields:
    - "retrieved_at"
    - "content_checksum"
  preserve_for_every_chunk: true
