{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação indisponível | Getnet Support</title>
  <script src="{% static 'portal-theme.js' %}"></script>
  <link rel="stylesheet" href="{% static 'portal.css' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'getnet-favicon-32x32.png' %}">
  <link rel="stylesheet" href="{% static 'portal-theme.css' %}">
  <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body class="login-page">
  <main class="login-layout">
    <a class="login-hero" href="{% url 'home' %}" aria-label="Ir para a página inicial">
      <img src="{% static 'herologin.png' %}" alt="">
    </a>

    <section class="login-panel" aria-label="Solicitação de redefinição de senha indisponível">
      <a class="login-back" href="{% url 'password-reset-request' %}" aria-label="Voltar à solicitação de redefinição">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5m6-6-6 6 6 6"/>
        </svg>
      </a>

      <div class="login-brand">
        <img src="{% static 'getnet-logo-wide.png' %}" alt="Getnet">
      </div>

      <div class="login-panel__body">
        <section class="login-view" aria-labelledby="reset-unavailable-title">
          <div class="login-auth__heading">
            <h1 id="reset-unavailable-title">Não foi possível processar agora</h1>
            <p role="alert">Tente novamente mais tarde.</p>
          </div>

          <a class="login-forgot" href="{% url 'password-reset-request' %}">Voltar à solicitação</a>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
