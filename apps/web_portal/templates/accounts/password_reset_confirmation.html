{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitação recebida | Getnet Support</title>
  <script src="{% static 'portal-theme.js' %}"></script>
  <link rel="stylesheet" href="{% static 'portal.css' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'getnet-favicon-32x32.png' %}">
  <link rel="stylesheet" href="{% static 'portal-theme.css' %}">
  <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body class="login-page">
  <main class="login-layout">
    <a class="login-hero" href="{% url 'home' %}" aria-label="Ir para a página inicial">
      <img src="{% static 'herologin.png' %}" alt="">
    </a>

    <section class="login-panel" aria-label="Resultado da solicitação de redefinição de senha">
      <a class="login-back" href="{% url 'login' %}" aria-label="Voltar para entrar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12H5m6-6-6 6 6 6"/>
        </svg>
      </a>

      <div class="login-brand">
        <img src="{% static 'getnet-logo-wide.png' %}" alt="Getnet">
      </div>

      <div class="login-panel__body">
        <section class="login-view" aria-labelledby="reset-result-title">
          <div class="login-auth__heading">
            <h1 id="reset-result-title">Solicitação recebida</h1>
            <p role="status">Se os dados informados corresponderem a uma conta válida, a solicitação será encaminhada ao administrador.</p>
            <p>Se necessário, o administrador poderá orientar você pelo canal interno aprovado.</p>
          </div>

          <a class="login-forgot" href="{% url 'login' %}">Voltar para entrar</a>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
