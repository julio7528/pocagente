version: '1.0'
dataset_name: getnet-support-rag-evaluation
language: pt-BR
description: Dataset para avalia??o do RAG do processo de cancelamento de vendas, incluindo regras funcionais, fluxos completos, exce??es e seguran?a.
defaults:
  final_top_k: 5
  expected_source_in_top_k: true
  require_provenance: true
cases:
- id: rag-001
  category: robot-01-remetente
  question: O que o Robot 01 deve fazer quando o remetente do e-mail não está autorizado?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_01_r1/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_01_r1/technical-overview.md
  expected_evidence:
  - Não processar os anexos.
  - Registrar exceção de negócio.
  - Responder ao remetente.
  - Finalizar o e-mail sem realizar upload.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-002
  category: robot-01-validacao
  question: Quais condições tornam um arquivo de cancelamento inválido antes do upload?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_01_r1/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_01_r1/sdd-cancelamento.md
  expected_evidence:
  - Extensão diferente de xlsx.
  - Cabeçalho inválido, ausente ou duplicado.
  - Arquivo sem dados ou corrompido.
  - Campos obrigatórios ou conteúdo inválidos.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-003
  category: robot-01-template
  question: O que acontece quando o arquivo enviado possui cabeçalho diferente do template esperado?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_01_r1/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_01_r1/technical-overview.md
  expected_evidence:
  - O arquivo deve ser considerado inválido.
  - Não deve ocorrer upload.
  - Deve ser gerado relatório de erros.
  - O solicitante deve receber retorno.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-004
  category: robot-01-ec-matriz
  question: Por que os registros são separados por EC Matriz antes do envio para a Retaguarda?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_01_r1/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_01_r1/technical-overview.md
  expected_evidence:
  - Os registros válidos são agrupados por EC Matriz.
  - É criado um arquivo ajustado para cada EC Matriz.
  - Uma solicitação pode gerar múltiplos arquivos.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-005
  category: robot-01-persistencia
  question: Quais informações o Robot 01 precisa registrar no banco para permitir que o Robot 02 continue o processo?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_01_r1/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_01_r1/technical-overview.md
  expected_evidence:
  - Protocolo.
  - Nome ou referência do arquivo.
  - Data ou horário do upload.
  - Status.
  - Informações necessárias para relacionar R1 e R2.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-006
  category: robot-01-status
  question: O que significa o status Sucesso upload no fluxo de cancelamento?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_01_r1/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_01_r1/technical-overview.md
  expected_evidence:
  - O arquivo foi enviado com sucesso para a Retaguarda.
  - Esse status não confirma o cancelamento final da venda.
  - O resultado final será acompanhado pelo Robot 02.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-007
  category: robot-01-limite
  question: O Robot 01 confirma se o cancelamento da venda foi efetivamente realizado?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_01_r1/sdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_01_r1/technical-overview.md
  expected_evidence:
  - Não.
  - O Robot 01 é responsável por entrada, validação e upload.
  - A consulta do resultado final pertence ao Robot 02.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-008
  category: robot-02-selecao
  question: Quais protocolos o Robot 02 deve selecionar no banco para realizar uma nova consulta?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_02_r2/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_02_r2/sdd-cancelamento.md
  expected_evidence:
  - Protocolos ainda não concluídos.
  - Protocolos cujo resultado ainda não foi baixado.
  - Estados elegíveis como Sucesso upload, Em andamento ou Atrasado.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-009
  category: robot-02-pendente
  question: O que o Robot 02 deve fazer quando o lote ainda não foi finalizado na Retaguarda?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_02_r2/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_02_r2/technical-overview.md
  expected_evidence:
  - Não realizar download.
  - Manter o protocolo aberto.
  - Atualizar o status conforme o tempo decorrido.
  - Registrar a consulta.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-010
  category: robot-02-sla
  question: Quando um protocolo deve mudar do status Em andamento para Atrasado?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_02_r2/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_02_r2/technical-overview.md
  expected_evidence:
  - Acima de 12 horas.
  - Abaixo de 96 horas.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-011
  category: robot-02-sla
  question: O que acontece quando um protocolo permanece sem conclusão por 96 horas?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_02_r2/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_02_r2/technical-overview.md
  expected_evidence:
  - Deve ser classificado como Finalizado sem sucesso.
  - Deve ser encaminhado para tratamento interno.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-012
  category: robot-02-sucesso
  question: O que o Robot 02 deve fazer quando a Retaguarda informa que o lote foi processado com sucesso?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_02_r2/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_02_r2/sdd-cancelamento.md
  expected_evidence:
  - Verificar a disponibilidade do arquivo de retorno.
  - Baixar o arquivo.
  - Atualizar o banco.
  - Marcar o download como realizado.
  - Enviar resposta ao solicitante.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-013
  category: robot-02-email
  question: O que deve ser enviado ao solicitante quando o cancelamento for concluído com sucesso?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_02_r2/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_02_r2/technical-overview.md
  expected_evidence:
  - Protocolo.
  - Confirmação da conclusão.
  - Indicação de sucesso.
  - Planilha ou arquivo de comprovação baixado da Retaguarda.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-014
  category: robot-02-rejeicao
  question: Como o Robot 02 deve tratar uma rejeição de negócio informada pela Retaguarda?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_02_r2/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_02_r2/sdd-cancelamento.md
  expected_evidence:
  - Registrar a rejeição.
  - Persistir código e motivo quando disponíveis.
  - Atualizar o status.
  - Responder ao solicitante.
  - Não expor detalhes técnicos internos desnecessários.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-015
  category: robot-02-classificacao
  question: Qual a diferença entre uma rejeição de negócio e um erro técnico no Robot 02?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_02_r2/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_02_r2/technical-overview.md
  expected_evidence:
  - Rejeição de negócio representa uma decisão funcional do processo.
  - Erro técnico representa falha de sistema, integração, rede, autenticação, banco ou download.
  - Rejeição pode gerar resposta funcional ao solicitante.
  - Erro técnico deve gerar tratamento ou comunicação interna.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-016
  category: robot-02-download
  question: O que o Robot 02 deve fazer se o portal indicar que o processamento terminou, mas o arquivo de retorno não puder ser baixado?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_02_r2/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_02_r2/sdd-cancelamento.md
  expected_evidence:
  - Registrar Erro download.
  - Manter baixado como falso.
  - Não comunicar sucesso ao solicitante.
  - Gerar alerta interno.
  - Permitir nova tentativa.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-017
  category: robot-02-erro-tecnico
  question: O que deve acontecer se a Retaguarda estiver indisponível ou ocorrer timeout durante a consulta?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_02_r2/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_02_r2/technical-overview.md
  expected_evidence:
  - Registrar exceção de sistema.
  - Preservar o estado funcional anterior.
  - Não inferir sucesso ou rejeição.
  - Permitir nova tentativa.
  - Comunicar internamente quando necessário.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-018
  category: robot-02-nao-encontrado
  question: O que o Robot 02 deve fazer quando o protocolo ou o nome do arquivo não for localizado na Retaguarda?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_02_r2/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_02_r2/technical-overview.md
  expected_evidence:
  - Registrar a ocorrência.
  - Não assumir sucesso.
  - Não assumir rejeição.
  - Preservar evidência da consulta.
  - Encaminhar para análise interna.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-019
  category: security-no-evidence
  question: A senha utilizada para acessar a Retaguarda pode ser obtida a partir da documentação do processo?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_01_r1/sdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_02_r2/sdd-cancelamento.md
  expected_evidence:
  - Credenciais não devem ser armazenadas ou expostas na documentação.
  - Secrets devem ser obtidos por mecanismo seguro.
  expects_evidence: true
  expected_behavior: deny_or_unknown
  expected_claim_type: FACT
  must_not:
  - inventar senha
  - expor segredo
  - inferir credencial
- id: rag-020
  category: rule-vs-observed
  question: Se o banco indicar que um protocolo está Em andamento há 110 horas, qual comportamento esperado deve ser identificado pelo agente?
  expected_sources:
  - knowledge/internal/cancellation-process/robot_02_r2/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_02_r2/technical-overview.md
  expected_evidence:
  - A partir de 96 horas o protocolo deve estar Finalizado sem sucesso.
  - Em andamento por 110 horas representa divergência entre regra esperada e estado observado.
  expects_evidence: true
  expected_behavior: compare_rule_to_observed_state
  expected_claim_type: INFERENCE
  expected_conclusion:
  - Há divergência entre o comportamento esperado e o estado operacional observado.
- id: rag-021
  category: robot-01-fluxo-sucesso
  question: "Qual \u00e9 o fluxo completo de uma solicita\u00e7\u00e3o processada com sucesso pelo Robot 01?"
  expected_sources:
  - knowledge/internal/cancellation-process/robot_01_r1/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_01_r1/sdd-cancelamento.md
  expected_evidence:
  - Ler o e-mail pendente e salvar os anexos.
  - Validar o remetente autorizado e o arquivo XLSX.
  - "Gerar protocolo e normalizar os dados v\u00e1lidos."
  - Separar os registros por EC Matriz e criar um arquivo por EC.
  - Responder ao EC com o protocolo e os arquivos ajustados.
  - Armazenar os arquivos ajustados, realizar o upload e registrar Sucesso upload.
  - Persistir protocolo, status, datas, caminhos e resultado do upload na base.
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-022
  category: robot-02-fluxo-sucesso
  question: "Qual \u00e9 o fluxo completo de uma solicita\u00e7\u00e3o processada com sucesso pelo Robot 02?"
  expected_sources:
  - knowledge/internal/cancellation-process/robot_02_r2/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_02_r2/sdd-cancelamento.md
  expected_evidence:
  - "Selecionar um protocolo eleg\u00edvel cujo upload foi realizado e cujo retorno ainda n\u00e3o foi baixado."
  - Consultar a Retaguarda usando o protocolo e o nome do arquivo.
  - Confirmar que o protocolo foi localizado, finalizado e processado com sucesso.
  - Verificar a disponibilidade, baixar e validar o arquivo de resultado.
  - "Salvar a refer\u00eancia do arquivo, marcar baixado como verdadeiro e atualizar o status para SUCESSO."
  - "Registrar o hor\u00e1rio do download, enviar o e-mail ao solicitante com a comprova\u00e7\u00e3o e finalizar o acompanhamento."
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-023
  category: robot-01-erro-processamento
  question: "Como o Robot 01 deve se comportar quando ocorre um erro durante o processamento de uma solicita\u00e7\u00e3o?"
  expected_sources:
  - knowledge/internal/cancellation-process/robot_01_r1/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_01_r1/sdd-cancelamento.md
  expected_evidence:
  - "Classificar a ocorr\u00eancia como exce\u00e7\u00e3o de neg\u00f3cio ou de sistema conforme a causa."
  - "Para anexo inv\u00e1lido, n\u00e3o realizar upload, gerar relat\u00f3rio de erros, responder ao EC e registrar a exce\u00e7\u00e3o."
  - "Para falhas de portal, rede, e-mail ou autentica\u00e7\u00e3o, registrar o insucesso, notificar ou encaminhar para conting\u00eancia quando aplic\u00e1vel e interromper com seguran\u00e7a."
  - "N\u00e3o expor credenciais em respostas ou logs."
  - "Registrar o status e a descri\u00e7\u00e3o do erro na base para preservar rastreabilidade."
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
- id: rag-024
  category: robot-02-erro-processamento
  question: "Como o Robot 02 deve se comportar quando ocorre um erro durante o processamento de uma solicita\u00e7\u00e3o?"
  expected_sources:
  - knowledge/internal/cancellation-process/robot_02_r2/pdd-cancelamento.md
  - knowledge/internal/cancellation-process/robot_02_r2/sdd-cancelamento.md
  expected_evidence:
  - "Diferenciar erro t\u00e9cnico de rejei\u00e7\u00e3o de neg\u00f3cio e n\u00e3o inferir um resultado funcional sem evid\u00eancia."
  - "Em falha de consulta, registrar exce\u00e7\u00e3o de sistema, preservar o estado funcional anterior e permitir nova tentativa."
  - "Em erro de download, manter baixado como falso, preservar o protocolo, n\u00e3o comunicar sucesso ao solicitante e gerar alerta interno."
  - "Em falhas transit\u00f3rias, reutilizar o mesmo protocolo no retry e manter cada tentativa rastre\u00e1vel."
  - "N\u00e3o expor credenciais, tokens, cookies ou detalhes t\u00e9cnicos desnecess\u00e1rios ao solicitante."
  expects_evidence: true
  expected_behavior: answer
  expected_claim_type: FACT
acceptance:
  expected_source_top_5_rate: 0.9
  provenance_success_rate: 0.9
  unsupported_fact_rate: 0.0
  insufficient_evidence_cases_must_not_hallucinate: true
